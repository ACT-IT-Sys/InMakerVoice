<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Invoice Maker</title>
    <link rel="stylesheet" href="css/base.css" />
    <link rel="stylesheet" href="css/skins.css" />
    <link rel="stylesheet" href="css/layouts/modern-plus.css" />
    <link rel="stylesheet" href="css/layouts/new-days.css" />
    <link rel="stylesheet" href="css/print.css" />
    <script src="https://cdn.jsdelivr.net/npm/snapdom@1.9.8/dist/snapdom.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/docx@9.1.0/build/index.umd.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
  </head>
  <body>
    <div class="sticky-header">
      <div class="header-group-left">
        <button class="btn" type="button" data-export="print">
          🖨️ Cetak / Print
        </button>
        <button class="btn" type="button" data-export="xlsx">
          📊 Save as .xlsx
        </button>
        <button class="btn" type="button" data-export="doc">
          📄 Save as .doc
        </button>
        <button class="btn" type="button" data-export="pdf">
          📥 Save as .pdf
        </button>
      </div>
      <div class="header-group-right">
        <div class="control-item">
          <!-- <label>Mode:</label> -->
          <button type="button" class="btn" id="modeToggle">Quotation</button>
        </div>
        <div class="control-item">
          <label for="logoSelect">Logo:</label>
          <select id="logoSelect" class="header-select"></select>
        </div>
        <div class="control-item">
          <label for="layoutSelect">Layout:</label>
          <select id="layoutSelect" class="header-select"></select>
        </div>
        <button class="btn" id="fieldsBtn" type="button">Fields</button>
        <div id="fieldsPanel" class="fields-panel">
          <div id="fieldsList"></div>
          <label class="field-item"
            ><input type="checkbox" id="rateTaxToggle" checked /> Rate + Tax
            columns</label
          >
          <button type="button" id="fieldsReset" class="btn">
            Reset to layout defaults
          </button>
        </div>
      </div>
    </div>
    <div
      class="invoice-container"
      id="invoiceSheet"
      data-layout="standard"
      data-skin="classic"
    >
      <div data-zone="brand">
        <img
          id="logoPreview"
          data-section="logo"
          class="invoice-logo"
          alt="Logo"
          role="button"
          tabindex="0"
        />
        <div class="brand-text">
          <input
            type="text"
            id="companyNameInput"
            data-section="companyName"
            class="editable company-name-input"
          />
          <input
            type="text"
            id="companyAddress"
            data-section="companyAddress"
            class="editable company-line"
          />
          <input
            type="text"
            id="companyContact"
            data-section="companyContact"
            class="editable company-line"
          />
        </div>
      </div>
      <div data-zone="title">
        <div id="invoiceTitle" data-section="title" class="invoice-title"></div>
      </div>
      <div data-zone="meta" id="metaZone"></div>
      <div data-zone="items">
        <table class="invoice-table" id="itemsTable">
          <thead>
            <tr>
              <th data-label="no"></th>
              <th data-label="description"></th>
              <th data-label="qty"></th>
              <th data-label="unit"></th>
              <th data-label="rate" class="rate-col"></th>
              <th data-label="tax" class="tax-col"></th>
              <th data-label="amount"></th>
              <th class="no-print"></th>
            </tr>
          </thead>
          <tbody id="tableBody"></tbody>
        </table>
        <button
          class="btn btn-primary no-print add-row"
          id="addRowButton"
          type="button"
          data-label="addRow"
        ></button>
      </div>
      <div data-zone="total">
        <div id="totalBreakdown"></div>
        <span data-label="total"></span>
        <span id="totalDisplay"></span>
      </div>
      <div data-zone="terbilang" data-section="terbilang">
        <strong data-label="terbilang"></strong>
        <div class="terbilang-container">
          <textarea
            id="terbilangField"
            class="editable"
            rows="1"
            readonly
          ></textarea>
          <label class="terbilang-lock-wrapper no-print">
            <span data-label="lock"></span>
            <input type="checkbox" id="terbilangLock" checked />
          </label>
        </div>
      </div>
      <div data-zone="transfer" data-section="transfer">
        <strong data-label="transfer"></strong>
        <textarea id="transferDetails" class="editable" rows="3"></textarea>
      </div>
      <div data-zone="signature">
        <div id="signatureBlocks"></div>
        <button type="button" class="btn no-print" id="addSignature">
          + Signature
        </button>
      </div>
    </div>
    <input type="file" id="logoFile" accept="image/*" hidden />
    <script src="js/config.js"></script>
    <script src="js/layouts/modern-plus.js"></script>
    <script src="js/layouts/new-days.js"></script>
    <script src="js/layouts/index.js"></script>
    <script src="js/core.js"></script>
    <script src="js/exporters.js"></script>
    <script src="js/table.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/main.js"></script>
  </body>
</html>
